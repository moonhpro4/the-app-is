<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>

</head>
<body>

<div id="content">

</div>

<script>
    // Handles the lockable bridge callback if triggered by engine.js when locked
    window.addEventListener('app-locked', function () {
        document.body.innerHTML = '404 site not found';
    });

    // Fallback mutation observer in case engine.js overlays or modifies elements
    const observer = new MutationObserver(function() {
        if (window.__LOCKED__ || document.body.classList.contains('locked')) {
            document.body.innerHTML = '404 site not found';
        }
    });
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });
</script>

</body>
</html>
