<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>

    <!-- Lockable Bridge Script -->
    <script src="https://lockable-bridge-api.lovable.app/engine.js" data-code="39b009781bb276edb1ffdcbb" async></script>

    <style>
        /* Automatically hide any modal, overlay, or box UI generated by external scripts */
        iframe, [class*="lock"], [id*="lock"], [style*="z-index"] {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="page-content">
404 - This site was deleted.<br><br>

It will be back soon.<br><br>

website hosted by wXpay<br>
silly thingamajig™
</div>

<script>
    function showLockedText() {
        // Replace all page body contents with pure unstyled text
        document.body.removeAttribute('style');
        document.body.innerHTML = '404 site not found';
    }

    // Trigger when the lock event fires
    window.addEventListener('app-locked', showLockedText);

    // Watch for script changes in case the lock state is active
    const observer = new MutationObserver(function() {
        if (window.__LOCKED__ || document.body.innerText.includes('Locked') || document.body.innerText.includes('Matrix Call API')) {
            observer.disconnect();
            showLockedText();
        }
    });

    observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true });
</script>

</body>
</html>
